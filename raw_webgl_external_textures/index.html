<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WebGL draw-call reproducer</title>
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; display: block; overflow: hidden; background: #071120; }
    #fps { position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); color: #75f6c8; font: 16px monospace; }
  </style>
</head>
<body>
  <canvas></canvas>
  <div id="fps">0.0 FPS</div>
  <script>
    const RECT_COUNT = 200;
    const RECT_SIZE = 4;
    const canvas = document.querySelector("canvas");
    const fps = document.querySelector("#fps");
    const gl = canvas.getContext("webgl2", {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
    });

    if (!gl) throw new Error("WebGL 2 is unavailable");

    const provokingVertex = gl.getExtension("WEBGL_provoking_vertex");
    // Uncomment for fast performance; leave commented for slow performance.
    // provokingVertex?.provokingVertexWEBGL(provokingVertex.FIRST_VERTEX_CONVENTION_WEBGL);

    const shader = (type, source) => {
      const value = gl.createShader(type);
      gl.shaderSource(value, source);
      gl.compileShader(value);
      if (!gl.getShaderParameter(value, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(value));
      }
      return value;
    };

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, `#version 300 es
      uniform vec2 viewport;
      uniform vec2 position_offset;
      out vec2 uv;
      flat out float shade;
      void main() {
        vec2 corners[4] = vec2[4](vec2(0), vec2(1, 0), vec2(0, 1), vec2(1));
        uv = corners[gl_VertexID];
        vec2 pixel = position_offset + uv * ${RECT_SIZE}.0;
        vec2 clip = pixel / viewport * 2.0 - 1.0;
        gl_Position = vec4(clip.x, -clip.y, 0, 1);
        shade = .75 + float(gl_VertexID & 1) * .25;
      }
    `));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `#version 300 es
      precision mediump float;
      uniform sampler2D image;
      in vec2 uv;
      flat in float shade;
      out vec4 color;
      void main() { color = texture(image, uv) * shade; }
    `));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const viewport = gl.getUniformLocation(program, "viewport");
    const positionOffset = gl.getUniformLocation(program, "position_offset");
    gl.uniform1i(gl.getUniformLocation(program, "image"), 0);

    const texture = (pixels) => {
      const value = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, value);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(pixels));
      return value;
    };
    const textures = [
      texture([255, 70, 120, 255, 35, 195, 255, 255, 35, 195, 255, 255, 255, 70, 120, 255]),
      texture([255, 210, 50, 255, 90, 255, 135, 255, 90, 255, 135, 255, 255, 210, 50, 255]),
    ];

    const resize = () => {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(viewport, canvas.width, canvas.height);
    };
    addEventListener("resize", resize);
    resize();

    let previous;
    const frame = (now) => {
      const elapsed = previous === undefined ? 0 : now - previous;
      previous = now;
      if (elapsed) fps.textContent = `${(1000 / elapsed).toFixed(1)} FPS`;
      gl.clear(gl.COLOR_BUFFER_BIT);

      for (let i = 0; i < RECT_COUNT; i++) {
        gl.uniform2f(
          positionOffset,
          (i * 37) % Math.max(1, canvas.width - RECT_SIZE),
          (i * 61) % Math.max(1, canvas.height - RECT_SIZE),
        );
        gl.bindTexture(gl.TEXTURE_2D, textures[i & 1]);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
