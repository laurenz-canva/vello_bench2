<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vello_bench2</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="overflow-hidden antialiased selection:bg-cyan-300/30">
  <div id="dashboard-root" class="relative min-h-screen">
    <div
      id="canvas-stage-shell"
      class="fixed inset-x-0 top-16 bottom-0 overflow-hidden border-t border-white/10 bg-slate-950 lg:top-20"
    >
      <div id="canvas-host" class="absolute inset-0 overflow-hidden"></div>
    </div>

    <div
      id="benchmark-stage-shell"
      class="fixed inset-x-0 top-16 bottom-0 overflow-hidden border-t border-white/10 bg-slate-950 lg:top-20"
    >
      <div id="benchmark-canvas-host" class="absolute inset-0 overflow-hidden"></div>
      <div id="ab-frame-host" class="absolute inset-0 hidden overflow-hidden"></div>
    </div>

    <div id="app-overlay" class="pointer-events-none relative z-20 min-h-screen"></div>
  </div>

  <script type="module">
    function supportsWasmSimd() {
      try {
        return WebAssembly.validate(
          new Uint8Array([
            0, 97, 115, 109, 1, 0, 0, 0,
            1, 5, 1, 96, 0, 1, 123,
            3, 2, 1, 0,
            10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11,
          ]),
        );
      } catch (_) {
        return false;
      }
    }

    const simdSupported = supportsWasmSimd();
    const simdPreferred = localStorage.getItem("vello_bench_simd") !== "0";
    const simd = simdSupported && simdPreferred;
    const simdStr = simd ? "simd" : "nosimd";

    // Optional integrated A/B support: when served with control/ and treatment/
    // assets present, the dashboard enables its built-in A/B harness.
    let abMode = false;
    try {
      const probe = await fetch("./control/vello_bench2.js", {
        method: "GET",
        cache: "no-store",
      });
      abMode = probe.ok;
    } catch (_) {}

    const query = new URLSearchParams(location.search);
    const abChild = query.get("ab_child") === "1";
    const variant = location.pathname.includes("/treatment/") ? "treatment" : "control";

    const mod_path = abMode
      ? (abChild ? "./vello_bench2.js" : "./control/vello_bench2.js")
      : `./${simdStr}/vello_bench2.js`;

    if (!abMode) {
      window.__vello_simd_supported = simdSupported;
      window.__vello_simd = simd;
      if (simdSupported) {
        window.__vello_toggle_simd = () => {
          localStorage.setItem("vello_bench_simd", simd ? "0" : "1");
          location.reload();
        };
      }
    }

    if (abMode) {
      window.__vello_ab_mode = !abChild;
      if (abChild) {
        window.__vello_ab_child = true;
        window.__vello_variant = variant;
      }
    }

    window.__vello_asset_base = new URL(abMode && abChild ? "../assets/" : "./assets/", location.href).href;

    const { default: init } = await import(mod_path);
    if (document.readyState === "complete") {
      init();
    } else {
      window.addEventListener("load", () => init());
    }
  </script>

</body>

</html>
