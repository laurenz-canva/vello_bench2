<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vello_bench2</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="overflow-hidden antialiased selection:bg-cyan-300/30">
  <div id="dashboard-root" class="relative min-h-screen">
    <div
      id="canvas-stage-shell"
      class="fixed inset-x-0 top-16 bottom-0 overflow-hidden border-t border-white/10 bg-slate-950 lg:top-20"
    >
      <div id="canvas-host" class="absolute inset-0 overflow-hidden"></div>
    </div>

    <div id="app-overlay" class="pointer-events-none relative z-20 min-h-screen"></div>
  </div>

  <script type="module">
    function supportsWasmSimd() {
      try {
        return WebAssembly.validate(
          new Uint8Array([
            0, 97, 115, 109, 1, 0, 0, 0,
            1, 5, 1, 96, 0, 1, 123,
            3, 2, 1, 0,
            10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11,
          ]),
        );
      } catch (_) {
        return false;
      }
    }

    const simdSupported = supportsWasmSimd();
    const simdPreferred = localStorage.getItem("vello_bench_simd") !== "0";
    const simd = simdSupported && simdPreferred;
    const simdStr = simd ? "simd" : "nosimd";

    window.__vello_simd_supported = simdSupported;
    window.__vello_simd = simd;
    if (simdSupported) {
      window.__vello_toggle_simd = () => {
        localStorage.setItem("vello_bench_simd", simd ? "0" : "1");
        location.reload();
      };
    }

    window.__vello_asset_base = new URL("./assets/", location.href).href;

    const { default: init, run } = await import(`./${simdStr}/vello_bench2.js`);
    const start = async () => {
      await init();
      await run();
    };

    function startSchedulerIndicators() {
      const menu = document.querySelector(".app-nav-control");
      if (!menu) {
        return;
      }

      const indicators = document.createElement("div");
      indicators.className = "app-scheduler-indicators";
      indicators.innerHTML = `
        <span class="app-scheduler-indicator"><span id="raf-pulse" class="app-scheduler-dot"></span>rAF</span>
        <span class="app-scheduler-indicator"><span id="timer-pulse" class="app-scheduler-dot"></span>timer</span>
      `;
      menu.append(indicators);

      const rafPulse = indicators.querySelector("#raf-pulse");
      const timerPulse = indicators.querySelector("#timer-pulse");

      const updateRafPulse = (time) => {
        rafPulse.style.opacity = String(0.2 + 0.8 * ((Math.sin(time / 125) + 1) / 2));
        requestAnimationFrame(updateRafPulse);
      };

      let timerBright = false;
      const updateTimerPulse = () => {
        timerBright = !timerBright;
        timerPulse.style.opacity = timerBright ? "1" : "0.2";
        setTimeout(updateTimerPulse, 125);
      };

      requestAnimationFrame(updateRafPulse);
      setTimeout(updateTimerPulse, 125);
    }

    if (document.readyState !== "complete") {
      await new Promise((resolve) => window.addEventListener("load", resolve));
    }
    await start();
    startSchedulerIndicators();
  </script>

</body>

</html>
