[package]
name = "external_texture_bench"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
js-sys = "0.3.98"
log = "0.4.29"
wasm-bindgen = "=0.2.123"
vello_common = { path = "../../vello/sparse_strips/vello_common" }
vello_hybrid = { path = "../../vello/sparse_strips/vello_hybrid", default-features = false, features = ["webgl", "text", "probe"] }
web-sys = { version = "0.3.83", features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Node",
    "Performance",
    "WebGl2RenderingContext",
    "WebGlTexture",
    "Window",
] }

[profile.release]
lto = "thin"
codegen-units = 1
