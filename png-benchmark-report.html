<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNG encoding benchmark</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: light-dark(#f7f8fb, #070c1a);
      --surface: light-dark(#ffffff, #0d1425);
      --text: light-dark(#182033, #edf2ff);
      --muted: light-dark(#667085, #95a2ba);
      --border: light-dark(#d9deea, #263149);
      --faster: light-dark(#087a3c, #56d98b);
      --slower: light-dark(#b3261e, #ff7b72);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.35;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
      line-height: 1.2;
    }

    .design-previews {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
      width: min(840px, 100%);
      margin: 0 0 20px;
    }

    .design-previews figure { margin: 0; }

    .design-previews img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    .design-previews figcaption {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .device + .device { margin-top: 24px; }

    .device-title {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.2;
    }

    .resolution + .resolution { margin-top: 16px; }

    .resolution-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.2;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    article {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    article h4,
    .file-sizes > h2 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
      line-height: 1.2;
    }

    article h4 small,
    .file-sizes > h2 small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th,
    td {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: 0; }

    th {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    th:first-child,
    td:first-child { text-align: left; }

    td:first-child {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .delta {
      margin-left: 3px;
      font-weight: 700;
    }

    .faster,
    .smaller { color: var(--faster); }

    .slower,
    .larger { color: var(--slower); }

    .baseline { color: var(--muted); }

    .file-sizes { margin-top: 28px; }
    .size-resolution { padding-top: 10px; }
    .size-resolution + .size-resolution { border-top: 1px solid var(--border); }
    .size-resolution .resolution-title { padding: 0 12px; }
    .table-scroll { overflow-x: auto; }
    .file-sizes table { min-width: 910px; }

    @media (max-width: 760px) {
      main { padding: 12px; }
      h1 { font-size: 22px; }
      .results { grid-template-columns: 1fr; }
      th, td { padding: 6px 9px; }
    }

    @media print {
      :root { color-scheme: light; }
      body { background: #fff; }
      main { width: 100%; padding: 0; }
      article { break-inside: avoid; }
    }
  </style>
</head>

    function percent(value) {
      return Math.round(Math.abs(value));
    }

    function timeCell(value, baseline, methodIndex, fixedDecimals) {
      const precision = fixedDecimals ?? (value < 10 ? 2 : 1);
      if (methodIndex === 0) {
        return `${value.toFixed(precision)} ms <span class="baseline">(baseline)</span>`;
      }
      const change = ((baseline - value) / baseline) * 100;
      const className = change >= 0 ? "faster" : "slower";
      const sign = change >= 0 ? "+" : "−";
      return `${value.toFixed(precision)} ms <span class="delta ${className}">(${sign}${percent(change)}%)</span>`;
    }

    function renderDevices() {
      const root = document.getElementById("device-results");
      root.innerHTML = devices.map((device, deviceIndex) => `
        <section class="device" aria-labelledby="device-${deviceIndex}">
          <h2 class="device-title" id="device-${deviceIndex}">${device.name}</h2>
          ${device.resolutions.map((resolution, resolutionIndex) => `
            <section class="resolution" aria-labelledby="device-${deviceIndex}-resolution-${resolutionIndex}">
              <h3 class="resolution-title" id="device-${deviceIndex}-resolution-${resolutionIndex}">${resolution.label}</h3>
              <div class="results">
                ${resolution.times.map((times, caseIndex) => `
                  <article>
                    <h4><span>${cases[caseIndex].name}</span><small>${cases[caseIndex].mode}</small></h4>
                    <table>
                      <thead><tr><th>Encoder</th><th>Average</th></tr></thead>
                      <tbody>
                        ${methods.map((method, methodIndex) => `
                          <tr><td>${method}</td><td>${timeCell(times[methodIndex], times[0], methodIndex, resolution.decimals)}</td></tr>
                        `).join("")}
                      </tbody>
                    </table>
                  </article>
                `).join("")}
              </div>
            </section>
          `).join("")}
        </section>
      `).join("");
    }

    function sizeCell(value, baseline, unit, methodIndex) {
      const precision = unit === "MiB" ? 2 : 1;
      if (methodIndex === 0) {
        return `${value.toFixed(precision)} ${unit} <span class="baseline">(baseline)</span>`;
      }
      const change = ((value - baseline) / baseline) * 100;
      const className = change <= 0 ? "smaller" : "larger";
      const sign = change <= 0 ? "−" : "+";
      return `${value.toFixed(precision)} ${unit} <span class="delta ${className}">(${sign}${Math.abs(change).toFixed(1)}%)</span>`;
    }

    function renderFileSizes() {
      const root = document.getElementById("file-size-results");
      root.innerHTML = fileSizes.map((resolution) => `

                      resolution.values[caseIndex][0],
                      resolution.units[caseIndex],
                      methodIndex,
                    )}</td>`).join("")}
                  </tr>
                `}).join("")}
              </tbody>
            </table>
